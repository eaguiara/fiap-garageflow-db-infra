name: Terraform Reset

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to reset (dev/staging/prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging

permissions:
  contents: read

env:
  TF_VERSION: '1.5.0'
  AWS_REGION: us-east-1

jobs:
  terraform-reset:
    name: Reset Terraform State
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize Terraform
        working-directory: ./terraform
        run: terraform init

      - name: Show Terraform plan (destroy)
        working-directory: ./terraform
        run: terraform plan -destroy -out=destroy.tfplan

      - name: Destroy all resources
        working-directory: ./terraform
        run: |
          echo "⚠️  DESTROYING ALL INFRASTRUCTURE FOR ${{ github.event.inputs.environment }} ENVIRONMENT"
          terraform destroy -auto-approve -lock=false
        env:
          TF_VAR_sql_db_user: ${{ secrets.SQL_DB_USER }}
          TF_VAR_sql_db_password: ${{ secrets.SQL_DB_PASSWORD }}
          TF_VAR_sql_db_name: ${{ secrets.SQL_DB_NAME }}
          TF_VAR_allowed_db_cidr_blocks: ${{ secrets.ALLOWED_DB_CIDR_BLOCKS }}

      - name: Clean up state files
        working-directory: ./terraform
        run: |
          rm -f terraform.tfstate*
          echo "✅ State files cleaned up"

      - name: Summary
        run: |
          echo "## ✅ Terraform Reset Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: **${{ github.event.inputs.environment }}**" >> $GITHUB_STEP_SUMMARY
          echo "- All resources destroyed" >> $GITHUB_STEP_SUMMARY
          echo "- State files cleaned" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "Run the **Deploy** workflow to recreate the infrastructure" >> $GITHUB_STEP_SUMMARY
