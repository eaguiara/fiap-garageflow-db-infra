name: Terraform Reset

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing the AWS and database secrets
        required: true
        default: homologacao
        type: choice
        options:
          - homologacao
          - producao

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_INPUT: "0"
      TF_VAR_sql_db_password: ${{ secrets.SQL_DB_PASSWORD }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - name: Delete all non-default VPCs
        run: bash ../scripts/reset-non-default-vpcs.sh
      - run: terraform init
      - name: Show destroy plan
        run: terraform plan -destroy
      - name: Destroy all resources
        run: terraform destroy -auto-approve
