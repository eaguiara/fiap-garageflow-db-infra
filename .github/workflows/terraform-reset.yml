name: Terraform Reset

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing the AWS and database secrets
        required: true
        default: homologacao
        type: choice
        options:
          - homologacao
          - producao

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_INPUT: "0"
      TF_VAR_sql_db_password: ${{ secrets.SQL_DB_PASSWORD }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - name: Delete all supported regional resources
        run: bash ../scripts/reset-non-default-vpcs.sh --force
      - name: Create Terraform state bucket
        id: state
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          state_bucket="garage-flow-terraform-state-${account_id}-${AWS_REGION}"
          if ! aws s3api head-bucket --bucket "${state_bucket}" 2>/dev/null; then
            aws s3api create-bucket --bucket "${state_bucket}" --create-bucket-configuration "LocationConstraint=${AWS_REGION}"
          fi
          aws s3api put-bucket-versioning --bucket "${state_bucket}" --versioning-configuration Status=Enabled
          echo "bucket=${state_bucket}" >> "${GITHUB_OUTPUT}"
      - run: terraform init -backend-config="bucket=${{ steps.state.outputs.bucket }}" -backend-config="key=garage-flow/${{ inputs.environment }}/database.tfstate" -backend-config="region=${AWS_REGION}" -backend-config="encrypt=true"
      - name: Show destroy plan
        run: terraform plan -destroy
      - name: Destroy all resources
        run: terraform destroy -auto-approve
